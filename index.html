<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>For The People — Useful Apps</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#eef3ff;font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:auto;padding:18px}header{display:flex;align-items:center;gap:18px;justify-content:space-between;border-bottom:1px solid #1d2638;padding:10px 0 18px}.brand{font-size:22px;font-weight:800}nav a{margin:0 8px;color:#aeb9cf;font-size:14px}.hero{padding:55px 0 35px;text-align:center}.hero h1{font-size:clamp(34px,7vw,60px);margin:10px 0;background:linear-gradient(90deg,#fff,#79aaff);-webkit-background-clip:text;color:transparent}.hero p{color:#9ca9bf;font-size:17px}.search{width:min(700px,100%);padding:15px 18px;border-radius:14px;border:1px solid #27334a;background:#101726;color:white;font-size:16px;outline:none}.chips{display:flex;gap:10px;overflow:auto;padding:8px 0 25px}.chip{border:1px solid #27334a;background:#101726;color:#bdc8da;border-radius:999px;padding:10px 15px;white-space:nowrap;cursor:pointer}.chip.active{background:#287cff;color:#fff;border-color:#287cff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:#0e1523;border:1px solid #1f2a3e;border-radius:18px;padding:18px;box-shadow:0 10px 35px #0005}.logo{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#287cff,#725cff);display:grid;place-items:center;font-weight:900;font-size:18px;margin-bottom:15px}.cat{font-size:12px;color:#70a6ff}.card h3{margin:7px 0}.card p{color:#94a2b9;font-size:13px;min-height:38px}.btn{display:block;text-align:center;background:#287cff;padding:11px;border-radius:11px;font-weight:700;margin-top:13px}.official{font-size:11px;color:#70e0a2;margin-top:10px}footer{border-top:1px solid #1d2638;margin-top:45px;padding:25px 0;color:#7f8ba0;font-size:13px;text-align:center}.empty{padding:30px;color:#94a2b9;text-align:center;grid-column:1/-1}
</style></head>
<body><div class="wrap">
<header><div class="brand">✦ For The People</div><nav><a href="#">Home</a><a href="#apps">Apps</a><a href="#categories">Categories</a></nav></header>
<section class="hero"><div style="color:#6fa4ff;font-weight:700">BETTER APPS • BIGGER DREAMS</div><h1>Welcome to For The People</h1><p>Useful apps and websites, all in one place.</p><input id="search" class="search" placeholder="Search apps..."></section>
<section id="categories"><div id="chips" class="chips"></div></section>
<section id="apps"><div id="grid" class="grid"><div class="empty">Loading apps...</div></div></section>
<footer>For The People • Official download links only.<br>We do not host cracked, modified or unauthorized premium APKs.</footer>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBNS52LiR27R8xlJZU34F5QGzt7X5JovKU",
  authDomain: "for-the-people-f0873.firebaseapp.com",
  databaseURL: "https://for-the-people-f0873-default-rtdb.firebaseio.com",
  projectId: "for-the-people-f0873",
  storageBucket: "for-the-people-f0873.firebasestorage.app",
  messagingSenderId: "1062809074315",
  appId: "1:1062809074315:web:13136bd28328c2c12df28e",
  measurementId: "G-WHWBFMQ21F"
};
const app=initializeApp(firebaseConfig), db=getDatabase(app);
const defaults=[["CapCut", "Video Editing", "Video editor & creator tools", "https://play.google.com/store/apps/details/CapCut?hl=en_IN&id=com.lemon.lvoverseas", "CC"], ["Instagram", "Social", "Share photos and videos", "https://play.google.com/store/apps/details?id=com.instagram.android", "IG"], ["VN Video Editor", "Video Editing", "Advanced video editor", "https://play.google.com/store/apps/details?id=com.frontrow.vlog", "VN"], ["Netflix", "Entertainment", "Movies and series", "https://play.google.com/store/apps/details?id=com.netflix.mediaclient", "N"], ["BGMI", "Games", "Mobile battle royale", "https://play.google.com/store/apps/details?id=com.pubg.imobile", "BG"], ["JioHotstar", "Entertainment", "Sports, movies and shows", "https://play.google.com/store/apps/details?id=in.startv.hotstar", "JH"], ["InShot", "Video Editing", "Photo and video editor", "https://play.google.com/store/apps/details?gl=IN&hl=en-GB&id=com.camerasideas.instashot", "IS"], ["Sarkari Result", "Education", "Jobs and exam results", "https://www.sarkariresult.com/", "SR"], ["Rojgar With Ankit", "Education", "Exam preparation", "https://www.rojgarwithankit.com/", "RA"], ["YouTube", "Video", "Watch and share videos", "https://play.google.com/store/apps/details?gl=IN&hl=en_IN&id=com.google.android.youtube", "YT"]];
let data=defaults, categories=["All","Video Editing","Social","Games","Entertainment","Education","Video","Tools","More"], active="All";
const grid=document.getElementById("grid"), chips=document.getElementById("chips"), search=document.getElementById("search");
function renderChips(){chips.innerHTML=categories.map(c=>`<button class="chip ${c===active?'active':''}" data-c="${c}">${c}</button>`).join(""); chips.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{active=b.dataset.c;render()})}
function render(){renderChips(); const q=search.value.toLowerCase().trim(); const list=data.filter(a=>(active==="All"||a.category===active)&&(!q||a.name.toLowerCase().includes(q)||a.description.toLowerCase().includes(q))); grid.innerHTML=list.length?list.map(a=>`<article class="card"><div class="logo">${a.logoText||a.name.slice(0,2).toUpperCase()}</div><div class="cat">${a.category}</div><h3>${a.name}</h3><p>${a.description}</p><a class="btn" href="${a.url}" target="_blank" rel="noopener">Official Download ↗</a><div class="official">✓ Official link</div></article>`).join(""):`<div class="empty">No apps found.</div>`}
search.addEventListener("input",render);
function normalizeApp(a){
  if(Array.isArray(a)) return {name:a[0]||"",category:a[1]||"",description:a[2]||"",url:a[3]||"",logoText:a[4]||""};
  return a||{};
}
onValue(ref(db,"apps"),s=>{
  try{
    const v=s.val();
    const arr=v?Object.values(v).map(normalizeApp).filter(a=>a.name&&a.url):[];
    if(arr.length) data=arr;
    render();
  }catch(e){console.error(e);render()}
},e=>{console.error(e);render()});
onValue(ref(db,"categories"),s=>{const v=s.val(); if(Array.isArray(v)) categories=v; else if(v) categories=Object.values(v); render()},()=>render());
render();
</script></body></html>

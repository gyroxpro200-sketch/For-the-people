<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>For The People — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#eef3ff;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:24px}.panel,.stat{background:#0e1523;border:1px solid #1f2a3e;border-radius:16px;padding:18px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat b{font-size:28px}label{display:block;color:#8e9ab0;font-size:12px;margin:10px 0 5px}input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #26334a;background:#080e1a;color:#fff}button,.btn{border:0;border-radius:10px;padding:11px 15px;background:#287cff;color:#fff;font-weight:700;cursor:pointer}.danger{background:#7e2330}.muted{color:#8e9ab0;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 5px;border-bottom:1px solid #1f2a3e;text-align:left}.actions button{margin:2px}#login{max-width:430px;margin:70px auto}.hidden{display:none}@media(max-width:650px){.stats,.row{grid-template-columns:1fr}table{font-size:11px}}
</style></head>
<body><div class="wrap">
<div id="login" class="panel"><h1>🔐 For The People Admin</h1><p class="muted">Sign in with the Firebase Authentication account you created.</p>
<label>Email</label><input id="email" type="email" placeholder="Your Firebase email">
<label>Password</label><input id="pass" type="password" placeholder="Password">
<button id="loginBtn">Sign in</button><p id="loginMsg" class="muted"></p></div>
<div id="app" class="hidden">
<div class="top"><div><h1>For The People — Admin</h1><div id="user" class="muted"></div></div><div><button id="siteBtn">View Website ↗</button> <button id="logout">Logout</button></div></div>
<div class="stats"><div class="stat"><b id="count">0</b><br>Apps</div><div class="stat"><b id="catCount">0</b><br>Categories</div><div class="stat"><b>✓</b><br>Firebase Connected</div></div>
<div class="panel"><h2>➕ Add / Edit App</h2><input type="hidden" id="editId">
<div class="row"><div><label>Name</label><input id="name"></div><div><label>Category</label><input id="category" placeholder="Video Editing"></div></div>
<label>Description</label><textarea id="description" rows="2"></textarea><label>Official URL</label><input id="url" placeholder="https://...">
<label>Logo Text</label><input id="logoText" placeholder="APP"><br><br><button id="save">Save App</button> <button id="clear">Clear</button><p id="msg" class="muted"></p></div>
<div class="panel"><h2>📱 Manage Apps</h2><input id="filter" placeholder="Search apps..."><div style="overflow:auto"><table><thead><tr><th>App</th><th>Category</th><th>Action</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
<div class="panel"><h2>⚙️ Categories</h2><label>Comma separated</label><input id="cats"><br><br><button id="saveCats">Save Categories</button><p class="muted">Public website updates from Firebase in real time.</p></div>
</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getDatabase,ref,onValue,set,push,remove,update} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBNS52LiR27R8xlJZU34F5QGzt7X5JovKU",
  authDomain: "for-the-people-f0873.firebaseapp.com",
  databaseURL: "https://for-the-people-f0873-default-rtdb.firebaseio.com",
  projectId: "for-the-people-f0873",
  storageBucket: "for-the-people-f0873.firebasestorage.app",
  messagingSenderId: "1062809074315",
  appId: "1:1062809074315:web:13136bd28328c2c12df28e",
  measurementId: "G-WHWBFMQ21F"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id); let apps={}, cats=[];
const defaults=[["CapCut", "Video Editing", "Video editor & creator tools", "https://play.google.com/store/apps/details/CapCut?hl=en_IN&id=com.lemon.lvoverseas", "CC"], ["Instagram", "Social", "Share photos and videos", "https://play.google.com/store/apps/details?id=com.instagram.android", "IG"], ["VN Video Editor", "Video Editing", "Advanced video editor", "https://play.google.com/store/apps/details?id=com.frontrow.vlog", "VN"], ["Netflix", "Entertainment", "Movies and series", "https://play.google.com/store/apps/details?id=com.netflix.mediaclient", "N"], ["BGMI", "Games", "Mobile battle royale", "https://play.google.com/store/apps/details?id=com.pubg.imobile", "BG"], ["JioHotstar", "Entertainment", "Sports, movies and shows", "https://play.google.com/store/apps/details?id=in.startv.hotstar", "JH"], ["InShot", "Video Editing", "Photo and video editor", "https://play.google.com/store/apps/details?gl=IN&hl=en-GB&id=com.camerasideas.instashot", "IS"], ["Sarkari Result", "Education", "Jobs and exam results", "https://www.sarkariresult.com/", "SR"], ["Rojgar With Ankit", "Education", "Exam preparation", "https://www.rojgarwithankit.com/", "RA"], ["YouTube", "Video", "Watch and share videos", "https://play.google.com/store/apps/details?gl=IN&hl=en_IN&id=com.google.android.youtube", "YT"]];
function seedIfEmpty(){onValue(ref(db,"apps"),s=>{if(!s.exists()){const obj={}; defaults.forEach((a,i)=>obj["app"+(i+1)]=a); set(ref(db,"apps"),obj)}},{onlyOnce:true});}
onAuthStateChanged(auth,u=>{if(u){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("user").textContent="Signed in as "+u.email;seedIfEmpty();load();}else{$("login").classList.remove("hidden");$("app").classList.add("hidden")}});
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value)}catch(e){$("loginMsg").textContent=e.message}};
$("logout").onclick=()=>signOut(auth); $("siteBtn").onclick=()=>location.href="./";
function load(){onValue(ref(db,"apps"),s=>{apps=s.val()||{};render()});onValue(ref(db,"categories"),s=>{const v=s.val();cats=Array.isArray(v)?v:(v?Object.values(v):["All","Video Editing","Social","Games","Entertainment","Education","Video","Tools","More"]);$("cats").value=cats.filter(x=>x!=="All").join(", ");render()})}
function render(){const arr=Object.entries(apps);$("count").textContent=arr.length;$("catCount").textContent=cats.length?cats.filter(x=>x!=="All").length:0;const q=$("filter").value.toLowerCase();$("tbody").innerHTML=arr.filter(([id,a])=>(a.name||"").toLowerCase().includes(q)).map(([id,a])=>`<tr><td><b>${a.name}</b><br><span class="muted">${a.description||""}</span></td><td>${a.category||""}</td><td class="actions"><button data-edit="${id}">Edit</button><button class="danger" data-del="${id}">Delete</button></td></tr>`).join("");document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del(b.dataset.del))}
$("filter").oninput=render;
function clearForm(){["editId","name","category","description","url","logoText"].forEach(x=>$(x).value="");$("msg").textContent=""}
$("clear").onclick=clearForm;
function edit(id){const a=apps[id];$("editId").value=id;$("name").value=a.name||"";$("category").value=a.category||"";$("description").value=a.description||"";$("url").value=a.url||"";$("logoText").value=a.logoText||"";scrollTo(0,0)}
$("save").onclick=async()=>{const id=$("editId").value||push(ref(db,"apps")).key;const a={name:$("name").value.trim(),category:$("category").value.trim(),description:$("description").value.trim(),url:$("url").value.trim(),logoText:$("logoText").value.trim()||$("name").value.trim().slice(0,2).toUpperCase()};if(!a.name||!a.url){$("msg").textContent="Name and Official URL are required.";return}try{await set(ref(db,"apps/"+id),a);$("msg").textContent="✓ Saved to Firebase";clearForm()}catch(e){$("msg").textContent=e.message}};
async function del(id){if(confirm("Delete this app?")){try{await remove(ref(db,"apps/"+id))}catch(e){alert(e.message)}}}
$("saveCats").onclick=async()=>{const list=$("cats").value.split(",").map(x=>x.trim()).filter(Boolean);try{await set(ref(db,"categories"),["All",...list]);alert("Categories saved to Firebase.")}catch(e){alert(e.message)}};
</script></body></html>
